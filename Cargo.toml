[package]
name = "xmip-core-transport-mllp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-transport-mllp"
description = "MLLP transport: HL7 Minimal Lower Layer Protocol framing over TCP, one framed message is one Stream, the acknowledgement travels back on the same connection. A xmip-core-transport technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). Standard library otherwise: MLLP is three bytes,
# over TCP through the capability's sockets, so the tcp technology is not a
# carrier here. Its declaration takes the capability's `timeout`
# (`transport::configured::timeout`).
transport = { workspace = true }
# A frame read to its end bytes under the ceiling (`net::read`,
# `net::MAX_BODY`).
net = { workspace = true, optional = true }
# The settings this technology declares (xcore::settings), read through
# transport::Configured (ADR-0064, amendment 2026-09-26).
xcore = { workspace = true }
# The HL7 acknowledgement a verdict writes back (`hl7_v2::acknowledge`), and
# the MSA-1 a send reads off the answer: HL7's content, composed once there,
# and only the code's.
hl7_v2 = { workspace = true, optional = true }

[features]
# The code and its declaration: the transport guide's "The declaration",
# module/core/capability/transport/doc/adding-a-transport.md.
default = ["declaration", "dep:net", "dep:hl7_v2"]
# The declaration alone.
declaration = []

[dev-dependencies]
# The loopback payloads the tests drive, from the capability's test
# support and never a production build (ADR-0044).
transport = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
